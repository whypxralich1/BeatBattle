{% extends 'base.html' %}

{% block title %}Удаление трека | BeatBattle{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <h2 class="mb-4 text-center">Удаление трека</h2>

                    <p class="text-center">Вы действительно хотите удалить трек <strong>{{ object.artist }} — {{ object.title }}</strong>?</p>

                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <form method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">Удалить</button>
                        </form>

                        <a href="{% url 'track_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
